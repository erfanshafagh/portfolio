<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Erfan Shafagh</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/base.css" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") {
            t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <style>
      .nf {
        position: relative;
        z-index: 1;
        min-block-size: 100vh;
        min-block-size: 100dvh;
        display: grid;
        place-content: center;
        justify-items: center;
        text-align: center;
        gap: 14px;
        padding: 24px;
      }
      .nf-code {
        font-family: var(--font-display);
        font-size: clamp(3.5rem, 14vw, 6rem);
        font-weight: 600;
        letter-spacing: -0.05em;
        line-height: 1;
        color: var(--accent2);
      }
      .nf-title {
        font-family: var(--font-display);
        font-size: clamp(1.3rem, 5vw, 1.8rem);
        font-weight: 600;
        color: var(--text-1);
      }
      .nf-text {
        color: var(--text-2);
        max-inline-size: 42ch;
      }
      .nf-link {
        margin-block-start: 8px;
        padding: 12px 24px;
        min-block-size: var(--tap);
        display: inline-flex;
        align-items: center;
        border-radius: var(--r-pill);
        text-decoration: none;
        font-weight: 500;
        color: var(--text-1);
        border: 1px solid var(--border-hi);
        background: rgba(var(--accent-rgb), 0.12);
        transition: background var(--fast) var(--ease), border-color var(--fast) var(--ease);
      }
      .nf-link:hover {
        background: rgba(var(--accent2-rgb), 0.18);
        border-color: var(--accent2);
      }
    </style>
  </head>
  <body>
    <main class="nf">
      <p class="nf-code">404</p>
      <h1 class="nf-title">This page doesn't exist</h1>
      <p class="nf-text">The link may be out of date, or the page may have moved.</p>
      <a class="nf-link" href="/">Back to the portfolio</a>
    </main>
  </body>
</html>
